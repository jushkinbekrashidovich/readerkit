name: readerkit
version: 1.0.0+1
publish_to: none
description: A new Flutter project.
environment: 
  sdk: '>=3.1.2 <4.0.0'

dependencies: 
  cupertino_icons: ^1.0.2
  get: 4.6.6

  flutter_svg: ^2.0.9
  file_picker: ^6.1.1
  shared_preferences: ^2.2.2
  syncfusion_flutter_pdfviewer: ^24.1.43
  read_pdf_text: ^0.2.1
  flutter_widget_from_html_core: ^0.14.10+1
  google_fonts: ^6.1.0
  bionify: ^0.0.1+6
  http: ^1.1.0
  epub_view: ^3.2.0
  syncfusion_flutter_pdf: ^24.1.45
  dots_indicator: ^2.1.1
  flutter: 
    sdk: flutter

dev_dependencies: 
  flutter_lints: ^2.0.0
  flutter_test: 
    sdk: flutter

flutter: 
  uses-material-design: true
  

  fonts:
    - family: Bookerly
      fonts:
        - asset: fonts/Bookerly.ttf
    - family: AmazonEmber
      fonts:
        - asset: fonts/AmazonEmber.ttf
    - family: Baskervi
      fonts:
        - asset: fonts/Baskervi.ttf
    - family: Caec
      fonts:
        - asset: fonts/Caec.ttf
    - family: Futura
      fonts:
        - asset: fonts/Futura.ttf
    - family: Palatino
      fonts:
        - asset: fonts/Palatino.ttf            
    - family: News
      fonts:
        - asset: fonts/News.ttf

  assets:
    - assets/
    - assets/svg/
    - assets/sample.epub
    - assets/sample.pdf
  
  