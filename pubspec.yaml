name: readerkit
version: 1.0.0+1
publish_to: none
description: A new Flutter project.
environment: 
  sdk: '>=3.1.2 <4.0.0'

dependencies: 
  cupertino_icons: ^1.0.2
  get: 4.6.6

  flutter_svg: ^2.0.9
  file_picker: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_html: ^3.0.0-beta.2
  http: ^1.1.0
  epub_view: ^3.2.0
  syncfusion_flutter_pdf: ^24.1.45
  dots_indicator: ^2.1.1
  flutter_native_splash: ^2.2.16
  flutter: 
    sdk: flutter
    

dev_dependencies: 
  flutter_lints: ^2.0.0
  flutter_test: 
    sdk: flutter

flutter_native_splash:
    android: true
    ios: true
    web: true

    color: "#FFFFFF"
    image: "assets/logo.png"

flutter: 
  uses-material-design: true
  

  fonts:
    - family: Bookerly
      fonts:
        - asset: fonts/Bookerly.ttf
    - family: AmazonEmber
      fonts:
        - asset: fonts/AmazonEmber.ttf
    - family: Baskervi
      fonts:
        - asset: fonts/Baskervi.ttf
    - family: Caec
      fonts:
        - asset: fonts/Caec.ttf
    - family: Futura
      fonts:
        - asset: fonts/Futura.ttf
    - family: Palatino
      fonts:
        - asset: fonts/Palatino.ttf            
    - family: News
      fonts:
        - asset: fonts/News.ttf

  assets:
    - assets/
    - assets/svg/
    - assets/icons/
  
  